name = "dashboard-worker"
main = "dashboard-worker.js"
compatibility_date = "2026-04-12"

# KV Namespaces for dashboard-worker
[[kv_namespaces]]
binding = "RB_ARTISTS"
id = "YOUR_RB_ARTISTS_ID"
preview_id = "YOUR_RB_ARTISTS_PREVIEW_ID"

[[kv_namespaces]]
binding = "RB_TIERS"
id = "YOUR_RB_TIERS_ID"
preview_id = "YOUR_RB_TIERS_PREVIEW_ID"

# Environment Variables
[vars]
WORKER_TYPE = "dashboard"
