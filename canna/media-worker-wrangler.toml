name = "media-worker"
main = "media-worker.js"
compatibility_date = "2026-04-12"

# KV Namespaces for media-worker
[[kv_namespaces]]
binding = "RB_MEDIA_MAP"
id = "YOUR_RB_MEDIA_MAP_ID"
preview_id = "YOUR_RB_MEDIA_MAP_PREVIEW_ID"

# R2 Buckets for media-worker
[[r2_buckets]]
binding = "RB_MEDIA"
bucket_name = "rb-media"

[[r2_buckets]]
binding = "RB_BEATS"
bucket_name = "rb-beats"

[[r2_buckets]]
binding = "RB_ARTIST_ASSETS"
bucket_name = "rb-artist-assets"

[[r2_buckets]]
binding = "RB_AI_INGEST"
bucket_name = "rb-ai-ingest"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "rbb"

# Environment Variables
[vars]
WORKER_TYPE = "media"
