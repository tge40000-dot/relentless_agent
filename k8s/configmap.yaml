apiVersion: v1
kind: ConfigMap
metadata:
  name: relentless-config
  namespace: relentless-agent
data:
  DATABASE_URL: "postgresql://relentless_user:relentless_pass@postgres-service:5432/relentless_agent"
  REDIS_URL: "redis://redis-service:6379"
  POSTGRES_PASSWORD: "relentless_pass"
  POSTGRES_DB: "relentless_agent"
  POSTGRES_USER: "relentless_user"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
