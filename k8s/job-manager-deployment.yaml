apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-manager
  namespace: relentless-agent
  labels:
    app: job-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: job-manager
  template:
    metadata:
      labels:
        app: job-manager
    spec:
      containers:
      - name: job-manager
        image: relentless-agent:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "job_manager.py"]
        ports:
        - containerPort: 8001
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: relentless-config
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: relentless-config
              key: REDIS_URL
        - name: POSTGRES_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: relentless-config
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: job-manager-service
  namespace: relentless-agent
spec:
  selector:
    app: job-manager
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: job-manager-hpa
  namespace: relentless-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: job-manager
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
